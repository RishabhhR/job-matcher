<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow spot -->
  <circle cx="1000" cy="180" r="300" fill="#0d9488" opacity="0.15" filter="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 95)">
    <rect width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="m15 48 14-15 11 9 19-24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="48" r="4" fill="#ffffff"/>
    <circle cx="29" cy="33" r="4" fill="#ffffff"/>
    <circle cx="40" cy="42" r="4" fill="#ffffff"/>
    <circle cx="59" cy="18" r="4" fill="#ffffff"/>
  </g>

  <!-- Brand Name -->
  <text x="190" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">JobMatcher</text>

  <!-- Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">
    Never Miss a Job That Fits
  </text>
  <text x="100" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#2dd4bf" letter-spacing="-1.5">
    Your Real Experience.
  </text>

  <!-- Subtitle -->
  <text x="100" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="-0.3">
    Checks LinkedIn, Naukri and company career pages for new openings every day.
  </text>
  <text x="100" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="-0.3">
    Scores each job against your CV with daily personalized email digests.
  </text>

  <!-- Sources Pill Badges -->
  <g transform="translate(100, 505)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="65" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Greenhouse</text>

    <!-- Badge 2 -->
    <rect x="145" y="0" width="105" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="197" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Lever</text>

    <!-- Badge 3 -->
    <rect x="265" y="0" width="105" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="317" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Ashby</text>

    <!-- Badge 4 -->
    <rect x="385" y="0" width="120" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="445" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">LinkedIn</text>

    <!-- Badge 5 -->
    <rect x="520" y="0" width="115" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="577" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Naukri</text>
  </g>
</svg>
