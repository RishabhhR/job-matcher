<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobMatcher</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
  <script>
    try {
      const savedTheme = localStorage.getItem("jobmatcher-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Foundation (TASK-054) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <!-- View styles: each file is owned by its view task; do not edit index.html to add more. -->
  <link rel="stylesheet" href="css/matches.css">    <!-- TASK-056 (codex) -->
  <link rel="stylesheet" href="css/onboarding.css"> <!-- TASK-057 (antigravity) -->
  <link rel="stylesheet" href="css/profile.css">    <!-- TASK-057 (antigravity) -->
  <link rel="stylesheet" href="css/settings.css">   <!-- TASK-058 (antigravity) -->
  <!-- Clerk: publishable key is public by design; the secret key never reaches the browser. -->
  <script>window.__clerk_publishable_key = "pk_test_c2tpbGxlZC1vcmNhLTc4LmNsZXJrLmFjY291bnRzLmRldiQ";</script>
  <script async crossorigin="anonymous" src="https://skilled-orca-78.clerk.accounts.dev/npm/@clerk/clerk-js@4/dist/clerk.browser.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view-root">Skip to content</a>

  <div id="boot" class="boot" role="status" aria-live="polite" aria-busy="true">
    <div class="boot-visual" aria-hidden="true">
      <span class="boot-orbit boot-orbit-one"></span><span class="boot-orbit boot-orbit-two"></span>
      <svg viewBox="0 0 32 32" focusable="false"><circle cx="14" cy="14" r="8"/><path d="m20 20 6 6M14 10v8m-4-4h8"/></svg>
    </div>
    <div class="boot-copy"><strong class="boot-title">JobMatcher</strong><p id="boot-message">Connecting your workspace…</p>
      <p id="boot-slow" class="boot-slow">This is taking longer than usual. We’re still loading your account.</p>
      <button id="boot-retry" class="btn btn-primary" type="button" hidden>Try again</button>
    </div>
  </div>
  <div id="auth-root" class="auth-root" hidden></div>

  <header class="topnav" id="topnav" hidden>
    <div class="topnav-in">
      <a class="logo" href="#/matches">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false"><path d="M7 23.5 13.2 17l4.1 3.6L25 11"/><circle cx="7" cy="23.5" r="2.1"/><circle cx="13.2" cy="17" r="2.1"/><circle cx="17.3" cy="20.6" r="2.1"/><path d="M23.6 11H25v1.4"/></svg>
        </span>JobMatcher
      </a>
      <nav class="topnav-links" aria-label="Primary">
        <a href="#/matches" data-route="matches">Matches</a>
        <a href="#/profile" data-route="profile">Profile</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.1 15.2A8.5 8.5 0 0 1 8.8 3.9 8.6 8.6 0 1 0 20.1 15.2Z"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      </button>
      <div class="account">
        <button type="button" id="account-btn" class="avatar" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
          <span id="avatar-initials" aria-hidden="true">?</span><span class="sr-only">Account menu</span>
        </button>
        <div id="account-menu" class="menu" role="menu" aria-labelledby="account-btn" hidden>
          <p class="menu-label" id="account-email"></p>
          <button type="button" role="menuitem" id="signout-btn" class="menu-item">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="view-root" tabindex="-1"></main>

  <nav class="bottomnav" id="bottomnav" aria-label="Primary" hidden>
    <a href="#/matches" data-route="matches">Matches</a>
    <a href="#/profile" data-route="profile">Profile</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>

  <!-- Polite live region for route changes, scan progress and action results. -->
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toasts" class="toasts"></div>
</body>
</html>
