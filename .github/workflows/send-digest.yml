name: Daily Send Digest (9 AM / 9 PM IST)

on:
  schedule:
    # 03:30 UTC = 09:00 IST (Acts as a backup to Vercel Cron)
    - cron: "30 3 * * *"
    # 15:30 UTC = 21:00 IST
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Digest slot (am/pm) for manual runs"
        required: false
        default: "am"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Reconstruct private data files from secrets
        env:
          CV_TEXT: ${{ secrets.CV_TEXT }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          mkdir -p data
          printf '%s' "$CV_TEXT" > data/cv.txt
          printf '%s' "$PROFILE_JSON" > data/profile.json

      - name: Determine digest slot
        id: slot
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            echo "slot=am" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
            echo "slot=pm" >> "$GITHUB_OUTPUT"
          else
            echo "slot=${{ github.event.inputs.slot || 'am' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Email Digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_SLOT: ${{ steps.slot.outputs.slot }}
          DIGEST_MODE: email
        run: npm run digest

      - name: Remove reconstructed private data files
        if: always()
        run: rm -f data/cv.txt data/profile.json
