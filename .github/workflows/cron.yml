name: Job Match Digest Cron

# Schedule intentionally disabled: daily-scrape.yml is the single active twice-daily
# cron (runs the pipeline directly in Actions, already verified end-to-end with
# real DB writes + a sent email). This workflow pings a Vercel endpoint instead,
# but Vercel is missing TURSO_DATABASE_URL/TURSO_AUTH_TOKEN env vars and has no
# access to data/cv.txt or profile.json (gitignored, never deployed), so it would
# currently fail. Running both on the same schedule also doubles Groq/Gemini
# free-tier quota usage, which is what caused today's rate-limit failures.
# Left as workflow_dispatch-only so it can still be triggered/fixed manually later.
on:
  workflow_dispatch: # Enables manual run from the GitHub Actions tab

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Job Matcher Vercel API
        run: |
          curl -s -f -X GET "https://job-matcher-rishabhs-projects-8310fc71.vercel.app/api/cron-match"
