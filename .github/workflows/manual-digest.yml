name: Manual digest for one user

# TASK-083: scrape + score for one user, then email their top matches now.
# Input is the jm_users.id (or a unique 8+ character prefix), never an email address:
# workflow inputs are visible in this public repository's Actions logs.
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "jm_users.id or a unique prefix (8+ chars)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: job-matcher-hourly-digest
  cancel-in-progress: false

jobs:
  manual-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run manual digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          # Gmail SMTP (TASK-071): when both are set, digests go through Gmail instead of Resend.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          MANUAL_USER_ID: ${{ inputs.user_id }}
        run: npm run manual-digest
