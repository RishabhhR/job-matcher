name: Pre-Digest Scrape and Score (Bounded Bursts)

on:
  schedule:
    # AM Scrape Burst: 01:00, 01:30, 02:00, 02:30, 03:00 UTC (06:30, 07:00, 07:30, 08:00, 08:30 IST)
    - cron: "0,30 1-2 * * *"
    - cron: "0 3 * * *"
    # PM Scrape Burst: 13:00, 13:30, 14:00, 14:30, 15:00 UTC (18:30, 19:00, 19:30, 20:00, 20:30 IST)
    - cron: "0,30 13-14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Digest slot (am/pm) for manual runs"
        required: false
        default: "am"

concurrency:
  group: scrape-and-score
  cancel-in-progress: true

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Reconstruct private data files from secrets
        env:
          CV_TEXT: ${{ secrets.CV_TEXT }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          mkdir -p data
          printf '%s' "$CV_TEXT" > data/cv.txt
          printf '%s' "$PROFILE_JSON" > data/profile.json

      - name: Determine digest slot
        id: slot
        run: |
          echo "slot=${{ github.event.inputs.slot || 'auto' }}" >> "$GITHUB_OUTPUT"

      - name: Run Scraper & Scoring
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DIGEST_SLOT: ${{ steps.slot.outputs.slot }}
          DIGEST_MODE: scrape
        run: npm run digest

      - name: Remove reconstructed private data files
        if: always()
        run: rm -f data/cv.txt data/profile.json
