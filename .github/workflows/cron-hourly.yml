name: Hourly Scrape, Score, & Email Digest (Multi-User)

on:
  schedule:
    # :30 UTC is the top of the hour in Asia/Kolkata (UTC+05:30), matching
    # users' stored local digest hours and avoiding top-of-hour runner congestion.
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-matcher-hourly-digest
  cancel-in-progress: false

jobs:
  hourly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Hourly Cron Execution
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run cron-hourly
