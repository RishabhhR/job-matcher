name: Hourly Scrape, Score, & Email Digest (Multi-User)

on:
  # Using off-peak minute intervals (:15 and :45 UTC). GitHub Actions runner queue
  # congestion is lowest at non-standard minutes, drastically reducing runner delays
  # and dropped runs compared to top/half-hour (:00, :30) global peaks.
  # Dual slots per hour ensure reliability; duplicate executions are lightweight
  # (< 5s) no-ops protected by concurrency group and per-user DB claim.
  schedule:
    - cron: "15 * * * *"
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      python_review:
        description: Re-score current jobs with Python and email each eligible user a review
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-matcher-hourly-digest
  cancel-in-progress: false

jobs:
  hourly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run Hourly Cron Execution
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          # Gmail SMTP (TASK-071): when both are set, digests go through Gmail instead of Resend.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          PYTHON_REVIEW_RUN: ${{ inputs.python_review }}
        run: npm run cron-hourly
